[package]
name = "agt-bench"
description = "AGT bench: STT latency, RTF and WER over a folder of WAVs; LLM polish latency and output."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "agt-bench"
path = "src/main.rs"

[dependencies]
agt-core.workspace = true
agt-audio.workspace = true
agt-stt.workspace = true
agt-polish.workspace = true
agt-history.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing.workspace = true
serde.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
cuda = ["agt-stt/cuda"]
whisper = ["agt-stt/whisper"]
whisper-vulkan = ["agt-stt/whisper-vulkan"]
whisper-metal = ["agt-stt/whisper-metal"]
