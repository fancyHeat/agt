[package]
name = "agt"
description = "AGT (Actually Good Transcription): local hold-to-talk dictation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "agt"
path = "src/main.rs"

[dependencies]
agt-core.workspace = true
agt-audio.workspace = true
agt-platform.workspace = true
agt-stt.workspace = true
agt-polish.workspace = true
agt-overlay.workspace = true
agt-telemetry.workspace = true
agt-history.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std", "tracing-log"] }
tracing-log = { version = "0.2", default-features = false }
tray-icon = "0.26"
velopack = "1.2"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

# `agt stats` attaches to the console it was started from (release builds have none).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
# Optional STT engines/backends; see agt-stt's Cargo.toml and docs/benchmarks.md.
cuda = ["agt-stt/cuda"]
whisper = ["agt-stt/whisper"]
whisper-vulkan = ["agt-stt/whisper-vulkan"]
whisper-metal = ["agt-stt/whisper-metal"]
