<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AGT Meeting notes</title>
<script>
  // Rust delivers messages with window.agt.receive(msg). Defined before anything else; messages
  // that arrive before the page script has started are queued and replayed in order.
  (function () {
    var queue = [];
    window.agt = {
      receive: function (msg) {
        if (window.agt._handle) window.agt._handle(msg);
        else queue.push(msg);
      },
      _queue: queue,
      _handle: null,
      // Rust calls window.agt.flush() right before it hides the window (replaced below).
      flush: function () {}
    };
  })();
</script>
<style>
  :root {
    --bg: #f7f7f3;
    --bg-elev: #efefea;
    --fill: #e9e9e4;
    --fill-hover: #e1e1db;
    --me: #d9eeeb;
    --text: #1d1d1f;
    --text-2: #56565b;
    --text-3: #6b6b70;
    --line: rgba(0, 0, 0, 0.09);
    --line-strong: rgba(0, 0, 0, 0.16);
    --primary-bg: #1d1d1f;
    --primary-fg: #ffffff;
    --primary-hover: #000000;
    --btn-bg: #ffffff;
    --btn-hover: #f2f2ee;
    --seg-on: #ffffff;
    --red: #ff3b30;
    --focus: rgba(0, 122, 255, 0.5);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 4px 14px rgba(0, 0, 0, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1d;
      --bg-elev: #272726;
      --fill: #2e2e2c;
      --fill-hover: #383836;
      --me: #173a37;
      --text: #f2f2f0;
      --text-2: #b0b0ab;
      --text-3: #9a9a95;
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.18);
      --primary-bg: #f2f2f0;
      --primary-fg: #1d1d1f;
      --primary-hover: #ffffff;
      --btn-bg: #2a2a29;
      --btn-hover: #333331;
      --seg-on: #484845;
      --red: #ff453a;
      --focus: rgba(10, 132, 255, 0.6);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  button { font: inherit; color: inherit; cursor: default; }
  button:focus { outline: none; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .tnum { font-variant-numeric: tabular-nums; }

  .view { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  @media (max-width: 420px) { .wrap { padding-left: 16px; padding-right: 16px; } }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 28px; padding: 0 12px; border-radius: 7px;
    border: 1px solid var(--line-strong); background: var(--btn-bg);
    font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: background-color 120ms ease, opacity 120ms ease;
  }
  .btn:hover:not(:disabled) { background: var(--btn-hover); }
  .btn:disabled { opacity: 0.45; }
  .btn.sm { height: 26px; padding: 0 10px; font-size: 12.5px; }
  .btn.primary {
    background: var(--primary-bg); color: var(--primary-fg); border-color: transparent;
    font-weight: 600; height: 30px; padding: 0 14px;
  }
  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn.primary.busy:disabled { opacity: 1; }
  .btn.block { width: 100%; height: 34px; font-size: 13.5px; }
  .sq { width: 9px; height: 9px; border-radius: 2px; background: var(--red); flex: none; }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 7px; border: 0; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    color: var(--text-2); transition: background-color 120ms ease;
  }
  .icon-btn:hover { background: var(--fill); color: var(--text); }
  .icon-btn.xs { width: 20px; height: 20px; border-radius: 5px; }
  .link-btn {
    border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600;
    color: var(--text); text-decoration: underline; text-underline-offset: 2px;
    text-decoration-color: var(--line-strong); white-space: nowrap;
  }
  .link-btn:hover { text-decoration-color: currentColor; }

  .spin {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    border: 2px solid currentColor; border-right-color: transparent;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rec-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none;
    animation: breathe 1.8s ease-in-out infinite;
  }
  .rec-dot.paused { background: var(--text-3); animation: none; }
  @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.8); } }

  /* List view */
  .list-head { padding-top: 20px; padding-bottom: 6px; flex: none; }
  .list-head .wrap { display: flex; flex-direction: column; gap: 14px; }
  .vt { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
  .live-card {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px;
    border-radius: 10px; background: var(--bg-elev); border: 1px solid var(--line);
  }
  .live-card .lc-label { font-size: 13px; font-weight: 600; }
  .live-card .lc-title { font-size: 13px; color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .list-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; }
  .day { margin: 18px 0 4px; font-size: 12.5px; font-weight: 600; color: var(--text-2); padding-left: 10px; }
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 0; background: transparent; border-radius: 8px; padding: 8px 10px;
    transition: background-color 120ms ease;
  }
  .row:hover { background: var(--fill); }
  .row .r-main { flex: 1; min-width: 0; }
  .row .r-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .r-title.is-new, .live-card .lc-title.is-new { color: var(--text-3); }
  .row .r-sub { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .tag {
    flex: none; font-size: 11.5px; font-weight: 600; color: var(--text-2);
    border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 6px; line-height: 1.4;
  }
  .empty { color: var(--text-2); font-size: 13.5px; text-align: center; padding: 40px 12px; line-height: 1.55; }
  .empty strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }

  /* Meeting view header */
  .m-head { flex: none; padding-top: 12px; }
  .m-head .wrap { display: flex; flex-direction: column; gap: 6px; }
  .titlerow { display: flex; align-items: center; gap: 4px; margin-left: -6px; }
  .title-input {
    flex: 1; min-width: 0; font: inherit; font-size: 20px; line-height: 1.25; font-weight: 600;
    letter-spacing: -0.01em; color: var(--text); background: transparent;
    border: 0; border-radius: 6px; padding: 3px 6px; margin: 0;
    transition: background-color 120ms ease;
    -webkit-user-select: text; user-select: text;
  }
  .title-input:hover { background: var(--fill); }
  .title-input:focus { outline: none; background: var(--fill); }
  /* Untitled: the date title reads like a title; "New meeting..." (and any hint being typed over) is grey. */
  .title-input::placeholder { color: var(--text); opacity: 1; }
  .title-input.is-new::placeholder, .title-input:focus::placeholder { color: var(--text-3); }
  .indent { padding-left: 32px; }
  .meta { font-size: 13px; color: var(--text-2); }
  .live-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 10px;
    border-radius: 13px; background: var(--fill); font-size: 13px; font-weight: 500; margin-right: 2px;
  }
  .notice {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2);
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 6px 6px 10px; margin-top: 4px; line-height: 1.4;
  }
  .notice .n-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .notice .link-btn { margin-right: 4px; }
  /* Something went wrong: the text in full strength, a red dot before it. */
  .notice.alert { color: var(--text); }
  .notice.alert::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex: none;
  }

  /* Tabs */
  .tabs-wrap { flex: none; padding-top: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .tabs {
    display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill);
  }
  .tab {
    border: 0; background: transparent; border-radius: 7px; padding: 4px 12px;
    font-size: 13px; font-weight: 500; color: var(--text-2);
    display: inline-flex; align-items: center; gap: 7px;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .lv { display: inline-flex; gap: 3px; align-items: center; }
  .lv i {
    display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--text-2);
    opacity: 0.25; transform: scale(0.85); transition: opacity 90ms linear, transform 90ms linear;
  }
  .lv i.me { background: #0d9488; }

  /* Panels */
  .panels { flex: 1; min-height: 0; position: relative; }
  .panel { position: absolute; inset: 0; overflow-y: auto; overflow-anchor: none; }
  .panel.notes-panel { overflow: hidden; }
  .notes-panel .wrap { height: 100%; padding-left: 0; padding-right: 0; }
  #notes {
    display: block; width: 100%; height: 100%; margin: 0; border: 0; outline: none; resize: none;
    background: transparent; color: var(--text);
    font: inherit; font-size: 15px; line-height: 1.65;
    padding: 16px 20px 48px;
    -webkit-user-select: text; user-select: text;
  }
  @media (max-width: 420px) { #notes { padding-left: 16px; padding-right: 16px; } }
  #notes::placeholder { color: var(--text-3); }

  /* AI notes */
  .ai-wrap { padding-top: 16px; padding-bottom: 32px; }
  .state-box {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    padding: 18px; border-radius: 10px; background: var(--bg-elev); border: 1px solid var(--line);
    color: var(--text-2); font-size: 13.5px; line-height: 1.55;
  }
  .state-box strong { color: var(--text); font-size: 14px; }
  .state-row { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; }
  .state-box .err { color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .by { margin-top: 20px; font-size: 12px; color: var(--text-3); }
  .dim { opacity: 0.45; }

  .md { font-size: 14px; line-height: 1.6; -webkit-user-select: text; user-select: text; cursor: auto; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md h1 { font-size: 17px; line-height: 1.3; margin: 22px 0 8px; font-weight: 650; }
  .md h2 { font-size: 15px; line-height: 1.35; margin: 20px 0 6px; font-weight: 650; }
  .md h3 { font-size: 14px; line-height: 1.4; margin: 16px 0 4px; font-weight: 650; color: var(--text-2); }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md li > ul, .md li > ol { margin: 3px 0 0; }
  .md ul ul { list-style-type: circle; }
  .md li.task { list-style: none; }
  .md li.task::marker { content: ""; }
  .md .cb {
    display: inline-block; width: 14px; height: 14px; margin: 0 7px 0 -21px; vertical-align: -2px;
    border: 1.5px solid var(--text-3); border-radius: 4px; position: relative;
  }
  .md .cb.on { background: var(--text); border-color: var(--text); }
  .md .cb.on::after {
    content: ""; position: absolute; left: 3.5px; top: 0.5px; width: 3.5px; height: 7px;
    border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .md li.task.done .tt { color: var(--text-2); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .md code {
    font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--fill); border-radius: 4px; padding: 1px 5px;
  }
  .md pre { background: var(--fill); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 10px; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line-strong); color: var(--text-2); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .md strong { font-weight: 650; }

  /* Transcript */
  .t-wrap { padding-top: 10px; padding-bottom: 64px; }
  .ln { display: flex; flex-direction: column; margin-top: 12px; }
  .ln.cont { margin-top: 5px; }
  .ln.me { align-items: flex-end; }
  .ln.them { align-items: flex-start; }
  .ln-meta { font-size: 12px; color: var(--text-3); margin: 0 6px 3px; font-variant-numeric: tabular-nums; }
  .ln-meta b { font-weight: 600; color: var(--text-2); margin-right: 6px; }
  .bubble {
    max-width: 84%; padding: 7px 11px; border-radius: 14px; font-size: 14px; line-height: 1.42;
    white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; cursor: auto;
  }
  .me .bubble { background: var(--me); border-bottom-right-radius: 5px; }
  .them .bubble { background: var(--fill); border-bottom-left-radius: 5px; }
  .jump {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-radius: 14px; padding: 6px 12px 6px 10px;
    background: var(--primary-bg); color: var(--primary-fg);
    font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow);
  }
  .jump:hover { background: var(--primary-hover); }

  /* Footer */
  .foot { flex: none; border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: 12px; background: var(--bg); }
  .foot-row { display: flex; align-items: center; gap: 8px; }
  .foot-row .grow { flex: 1; }
  .foot-error {
    font-size: 12.5px; color: var(--text); margin-bottom: 8px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .foot-error::before { content: "Couldn't write notes: "; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0ms !important; }
    .rec-dot, .spin { animation: none !important; }
    .spin { border-right-color: currentColor; opacity: 0.6; }
  }
</style>
</head>
<body>

<section class="view" id="list-view">
  <header class="list-head">
    <div class="wrap">
      <h1 class="vt">Meetings</h1>
      <div id="list-action"></div>
      <div class="notice alert" id="l-notice" role="alert" hidden>
        <span class="n-text" id="l-notice-text"></span>
        <button class="icon-btn xs" id="l-notice-x" aria-label="Dismiss" title="Dismiss">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2 2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="list-scroll" id="list-scroll">
    <div class="wrap" id="list"></div>
  </div>
</section>

<section class="view" id="meeting-view" hidden>
  <header class="m-head">
    <div class="wrap">
      <div class="titlerow">
        <button class="icon-btn" id="back" aria-label="All meetings" title="All meetings">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input id="title" class="title-input" aria-label="Meeting title" maxlength="200" spellcheck="false" autocomplete="off">
      </div>
      <div class="meta indent" id="meta"></div>
      <div class="live-row indent" id="live-row" hidden>
        <span class="chip" id="chip"><span class="rec-dot" id="chip-dot"></span><span id="chip-label">Recording</span><span class="tnum" id="chip-time">00:00</span></span>
        <button class="btn sm" id="pause">Pause</button>
        <button class="btn sm" id="stop"><span class="sq" aria-hidden="true"></span>Stop</button>
      </div>
      <div class="notice" id="consent" role="note" hidden>
        <span class="n-text">Recording on this computer. Let people know you're taking notes.</span>
        <button class="icon-btn xs" id="consent-x" aria-label="Dismiss" title="Dismiss">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2 2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="notice" id="sys" role="status" hidden>
        <span class="n-text" id="sys-text"></span>
        <button class="link-btn" id="open-settings" hidden>Open settings</button>
        <button class="icon-btn xs" id="sys-x" aria-label="Dismiss" title="Dismiss" hidden>
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2 2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="notice alert" id="m-notice" role="alert" hidden>
        <span class="n-text" id="m-notice-text"></span>
        <button class="icon-btn xs" id="m-notice-x" aria-label="Dismiss" title="Dismiss">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2 2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="tabs-wrap">
    <div class="wrap">
      <div class="tabs" role="tablist" aria-label="Meeting">
        <button class="tab" role="tab" id="tab-notes" data-tab="notes" aria-controls="panel-notes">Notes</button>
        <button class="tab" role="tab" id="tab-ai" data-tab="ai" aria-controls="panel-ai">AI notes</button>
        <button class="tab" role="tab" id="tab-transcript" data-tab="transcript" aria-controls="panel-transcript">Transcript<span class="lv" id="lv" aria-hidden="true" title="Me and Them levels" hidden><i class="me" id="lv-me"></i><i class="them" id="lv-them"></i></span></button>
      </div>
    </div>
  </div>
  <main class="panels">
    <div class="panel notes-panel" role="tabpanel" id="panel-notes" aria-labelledby="tab-notes">
      <div class="wrap"><textarea id="notes" aria-label="My notes" spellcheck="true"></textarea></div>
    </div>
    <div class="panel" role="tabpanel" id="panel-ai" aria-labelledby="tab-ai" hidden>
      <div class="wrap ai-wrap" id="ai" aria-live="polite"></div>
    </div>
    <div class="panel" role="tabpanel" id="panel-transcript" aria-labelledby="tab-transcript" hidden>
      <div class="wrap t-wrap" id="t-list"></div>
    </div>
    <button class="jump" id="jump" hidden>
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5v7M1.8 5.4 5 8.5l3.2-3.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Jump to latest</span>
    </button>
  </main>
  <footer class="foot">
    <div class="wrap">
      <div class="foot-error" id="foot-error" role="alert" hidden></div>
      <div class="foot-row">
        <button class="btn primary" id="gen"><span class="spin" id="gen-spin" hidden></span><span id="gen-label">Generate notes</span></button>
        <span class="grow"></span>
        <button class="btn" id="copy">Copy</button>
        <button class="btn" id="folder">Folder</button>
      </div>
    </div>
  </footer>
</section>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }

  // ------------------------------------------------------------------ IPC
  var params = new URLSearchParams(location.search);
  var mock = null;
  if (!window.ipc) {
    var sent = [];
    window.__agtSent = sent;
    window.ipc = {
      postMessage: function (s) {
        var msg;
        try { msg = JSON.parse(s); } catch (e) { msg = s; }
        sent.push(msg);
        console.log('[agt ipc]', msg);
        if (mock) setTimeout(function () { mock.handle(msg); }, 0);
      }
    };
  }
  function send(msg) {
    try { window.ipc.postMessage(JSON.stringify(msg)); } catch (e) { console.error('[agt ipc] send failed', e); }
  }

  // ------------------------------------------------------------------ formatting
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function clock(ms) {
    var t = Math.max(0, Math.floor((+ms || 0) / 1000));
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);

        case 'meetings': onMeetings(msg.list); break;
        case 'notice': onNotice(msg.id, msg.text); break;
        case 'clear_notice': onClearNotice(msg.id, msg.text); break;
      }
    } catch (e) {
      console.error('[agt] could not handle', msg && msg.type, e);
    }
  };

  // ------------------------------------------------------------------ rendering
  function render(full) {

    renderHeader();
    renderTabs();
    if (full) renderTranscript();
    renderAi();
    renderFooter();
    if (full && S.tab === 'transcript' && follow) scrollBottom();
  }

  function metaText(m, live) {
    if (!m || !validTs(m.started_at)) return '';

    var ms = live ? elapsedOf(m.id) : (validTs(m.ended_at) ? m.ended_at - m.started_at : null);
    if (ms != null) parts.push(dur(ms));
    return parts.join(' · ');
  }

  function setTab(tab) {

      }

      if (validTs(x.started_at)) sub.push(fTime.format(new Date(x.started_at)));

  // ------------------------------------------------------------------ actions
  function summarize() {
    if (!S.m || !hasContent()) return;
    flushAll();
    S.sum[S.m.id] = { state: 'running' };
    send({ type: 'summarize', id: S.m.id });
    setTab('ai');
    renderTitleHint();
    renderAi();
    renderFooter();
  }
  function stopMeeting() {
    var id = S.liveId;
    if (!id) return;
    S.stopping[id] = true;
    send({ type: 'stop' });
    if (S.m && S.m.id === id) renderHeader();
    if (S.view === 'list') renderListAction();
  }
  function meetingMarkdown(m) {
    var out = ['# ' + ((m.title || '').trim() || m.default_title || 'Meeting')];
    var meta = metaText(m, liveOf(m.id));
    if (meta) out.push('', meta);
    // The same headings as meeting.md, Claude's own a level under "## Notes".
    if (m.summary && String(m.summary).trim()) out.push('', '## Notes', '', nestHeadings(String(m.summary).trim()));
    if ((m.notes || '').trim()) out.push('', '## My notes', '', m.notes.trim());
    if (m.lines.length) {
      out.push('', '## Transcript', '');
      m.lines.forEach(function (l) {
        out.push('[' + clock(l.start_ms) + '] ' + (l.speaker === 'me' ? 'Me' : 'Them') + ': ' + String(l.text || '').replace(/\s*\n\s*/g, ' '));
      });
    }
    return out.join('\n') + '\n';
  }

  // The AI notes' headings moved down so the highest is ### (Claude writes ## sections), as
  // meeting.md has them (store::nested_headings in Rust): every heading moves the same, none
  // goes past ######, and fenced code blocks are left alone.
  function nestHeadings(md) {
    var lines = md.split('\n'), fence = null;
    function indentOf(line) { return line.length - line.replace(/^ +/, '').length; }
    var levels = lines.map(function (line) {
      var indent = indentOf(line), text = line.slice(indent);
      var marker = indent <= 3 && /^(```|~~~)/.test(text) ? text.slice(0, 3) : null;
      if (fence) { if (marker === fence) fence = null; return 0; }
      if (marker) { fence = marker; return 0; }
      var h = indent <= 3 ? /^(#{1,6})(?:[ \t\r]|$)/.exec(text) : null;
      return h ? h[1].length : 0;
    });
    var top = levels.reduce(function (a, l) { return l && l < a ? l : a; }, 7);
    var down = top <= 6 ? Math.max(0, 3 - top) : 0;
    if (!down) return md;
    return lines.map(function (line, i) {
      var l = levels[i];
      if (!l) return line;
      var indent = indentOf(line);
      return line.slice(0, indent) + '#'.repeat(Math.min(6, l + down) - l) + line.slice(indent);
    }).join('\n');
  }

  el.back.addEventListener('click', function () {
    flushAll();
    S.view = 'list';

    send({ type: 'list' });
  });
  el.title.addEventListener('input', function () { if (S.m) { S.m.title = el.title.value; scheduleTitle(); } });
  el.title.addEventListener('keydown', function (e) {

    else if (e.key === 'Escape' && S.m) {

      // Back to what Rust has, untitled included.
      if (lastSentTitle[S.m.id] != null) S.m.title = lastSentTitle[S.m.id];
      el.title.value = S.m.title;

  });

      el.title.value = S.m.title;
      return;

  // ------------------------------------------------------------------ mock (plain browser with ?mock)
  if (window.__agtSent && params.has('mock')) mock = makeMock();

  function makeMock() {

    // arrive late (default 7, 0 for never); &tray=S starts a meeting S seconds after load even if
    // another meeting is open (a tray or pill start); &resend=S re-sends the meeting on screen
    // every S seconds (the pill's Notes button or an open of the current meeting);
    // &system=ok|no-permission|silent|unsupported sets the Them track's state (unsupported comes
    // with its reason); &auto writes the AI notes by themselves after a stop (auto_summary);
    // &fail=model|mic refuses or fails every start with a notice; &loading says the speech model
    // is still loading when a meeting starts (taken back at its first line); &notice=S sends a
    // meeting error S seconds in.
    var BIG = Math.max(0, parseInt(params.get('big') || '0', 10) || 0);
    var LATE = params.has('late') ? Math.max(0, parseInt(params.get('late'), 10) || 0) : 7;

    }

    }
    var SCRIPT = [

      ['me', 'That works. Smaller is easier to support in the first week.'],
      ['them', 'Agreed. Can you send me the onboarding checklist after this?'],
      ['me', "Yes, I'll send it this afternoon along with the timeline."],
      ['them', 'One more thing. Support wants a short guide for the meeting notes feature.'],
      ['me', 'I can write that. A one page guide with a few screenshots should do it.'],
      ['them', "Perfect. Let's check in again next Tuesday at ten."],
      ['me', "Sounds good. I'll put it on the calendar."],

      ['them', 'Nice. Does dictation still work during a meeting?'],
      ['me', 'Yes. Holding the hotkey keeps working, and that dictation stays out of the meeting transcript.']
    ];
    var SUMMARY = [
      '## Summary',
      'The launch stays on the **28th** if installer signing is finished in time, and the pilot gets *smaller* so support can keep up.',
      '',
      '## Key points',
      '- Launch target is the 28th',
      '  - Depends on installer signing finishing first',
      '  - The pricing page is still waiting on legal review',
      '- The pilot group drops from 100 to **50 seats**',
      '- Beta feedback is mostly positive; echo on speakers is now handled',
      '',
      '## Decisions',
      '1. Pilot with 50 seats instead of 100',
      '2. Weekly check-in moves to Tuesday at 10',
      '',
      '## Action items',
      '- [ ] Me: send the certificate request by Friday',
      '- [ ] Me: send the onboarding checklist and timeline this afternoon',
      '- [x] Dana: share legal comments on the pricing page',
      '- [ ] Me: write a one page guide for `meeting notes`, see [the draft](https://example.com/guide)'
    ].join('\n');
    function pastLines(n, seed) {
      var out = [];
      for (var i = 0; i < n; i++) {
        var s = SCRIPT[(i + seed) % SCRIPT.length];
        out.push({ id: i + 1, speaker: s[0], start_ms: i * 9000 + 1200, end_ms: i * 9000 + 6400, text: s[1] });
      }
      return out;
    }
    var store = {};
    function add(m) { store[m.id] = m; return m; }
    [
      { started: at(0, 9, 5), mins: 15, title: 'Standup', summary: '## Summary\nShort standup. Everyone is on track for the release.\n\n## Action items\n- [ ] Me: review the installer changes\n- [x] Sam: fix the tray icon in dark mode' },
      { started: at(1, 15, 0), mins: 28, title: 'Customer call: Acme rollout', summary: SUMMARY },
      { started: at(1, 10, 30), mins: 46, title: 'Design review', summary: null },
      { started: at(3, 13, 0), mins: 72, title: 'Vendor call', summary: null, failOnce: true },
      { started: at(7, 11, 15), mins: 55, title: 'Weekly planning', summary: '### Notes\n* Planning for the next two weeks\n* Hiring update: *two* interviews booked\n\nRaw HTML stays as text: <img src=x onerror="alert(1)"> and <b>not bold</b>. A [link](javascript:alert(1)) is only text.' },
      { started: at(16, 16, 45), mins: 31, title: 'Interview: support lead', summary: null },
      { started: new Date(new Date(now).getFullYear() - 1, 11, 12, 10, 0).getTime(), mins: 40, title: 'Year end review', summary: '## Summary\nA calm year end review.' },
      // Never named: its notes were never written.
      { started: at(2, 14, 0), mins: 20, title: '', summary: null }
    ].forEach(function (x, i) {
      add({
        id: idFor(x.started), title: x.title, started_at: x.started, ended_at: x.started + x.mins * 60000,
        notes: i === 1 ? 'Ask about pilot size\nConfirm launch date\n- signing\n- pricing page' : '',
        summary: x.summary, summary_by: x.summary ? 'Claude (sonnet)' : null,
        lines: pastLines(8 + i * 2, i * 3), failOnce: !!x.failOnce
      });
    });

    var live = null; // { id, elapsed, paused, system, lineTimer, levelTimer, tickTimer, next, talker }
    function list() {
      return Object.keys(store).map(function (k) {
        var m = store[k];
        return { id: m.id, title: m.title, default_title: dateTitle(m.started_at), started_at: m.started_at, ended_at: m.ended_at, has_summary: !!m.summary };
      });
    }
    function sendList() { deliver({ type: 'meetings', list: list() }); }
    function liveObj() {
      if (!live) return null;
      var o = { recording: !live.stopping, paused: live.paused, elapsed_ms: live.elapsed, system: live.system };
      if (live.system === 'unsupported') o.system_reason = REASON;
      return o;
    }
    function notice(text, id) {
      var msg = { type: 'notice', text: text };
      if (id != null) msg.id = id;
      deliver(msg);
    }
    function meetingMsg(id) {
      var m = store[id];
      if (!m) return null;
      return {
        type: 'meeting',
        meeting: { id: m.id, title: m.title, default_title: dateTitle(m.started_at), started_at: m.started_at, ended_at: m.ended_at, notes: m.notes, summary: m.summary, summary_by: m.summary_by, lines: m.lines },
        live: live && live.id === id ? liveObj() : null
      };
    }
    function start() {
      if (live) return;
      if (FAIL) { setTimeout(function () { notice(FAIL); }, 300); return; }
      var ts = Date.now();
      var m = add({
        id: idFor(ts), title: '',
        started_at: ts, ended_at: null, notes: '', summary: null, summary_by: null, lines: []
      });
      live = { id: m.id, elapsed: 0, paused: false, stopping: false, system: sysParam || 'ok', next: 0, talker: 'them', last: Date.now() };
      for (var b = 0; b < BIG; b++) {
        var sb = SCRIPT[b % SCRIPT.length];
        m.lines.push({ id: b + 1, speaker: sb[0], start_ms: b * 4200, end_ms: b * 4200 + 2400, text: sb[1] });
      }
      if (BIG) { live.next = BIG; live.elapsed = BIG * 4200 + 2000; }
      deliver(meetingMsg(m.id));
      if (params.has('loading')) notice(LOADING, m.id);
      if (params.has('notice')) {
        var nid = m.id;
        setTimeout(function () {
          if (live && live.id === nid) notice('The microphone stopped: the device was unplugged', nid);
        }, Math.max(0, +params.get('notice') || 6) * 1000);
      }
      live.tickTimer = setInterval(function () {
        if (!live) return;
        var t = Date.now();
        if (!live.paused && !live.stopping) live.elapsed += t - live.last;
        live.last = t;
        deliver({ type: 'live', id: live.id, live: liveObj() });
      }, 1000);
      live.lineTimer = setInterval(function () {
        if (!live || live.paused || live.stopping) return;
        var s = SCRIPT[live.next % SCRIPT.length];
        var n = live.next++;
        live.talker = SCRIPT[live.next % SCRIPT.length][0];
        // Fast mode runs a pretend clock so timestamps still spread out like a real call.
        var startMs = fast ? n * 4200 + Math.floor(Math.random() * 900)
          : Math.max(0, live.elapsed + (Date.now() - live.last) - 2600 - Math.floor(Math.random() * 600));
        // Every Kth line arrives late (an echo hold), so it lands a few lines up.
        if (LATE && n % LATE === LATE - 1) startMs = Math.max(0, startMs - (fast ? 3 * 4200 : 3 * LINE_MS + 800));
        var line = { id: n + 1, speaker: s[0], start_ms: startMs, end_ms: startMs + 2400, text: s[1] };
        store[live.id].lines.push(line);
        deliver({ type: 'line', id: live.id, line: line });
        // The first line: the model has loaded, so its notice is taken back.
        if (params.has('loading') && n === BIG) deliver({ type: 'clear_notice', id: live.id, text: LOADING });
      }, LINE_MS);
      live.levelTimer = setInterval(function () {
        if (!live) return;
        if (live.paused || live.stopping) { deliver({ type: 'levels', me: 0, them: 0 }); return; }
        var t = Date.now() / 1000;
        var talk = 0.25 + 0.55 * Math.abs(Math.sin(t * 5.3)) * (0.6 + 0.4 * Math.random());
        var quiet = 0.02 + Math.random() * 0.04;
        var them = live.system === 'ok' ? (live.talker === 'them' ? talk : quiet) : 0;
        deliver({ type: 'levels', me: live.talker === 'me' ? talk : quiet, them: them });
      }, 66);
      sendList();
    }
    function stop() {
      if (!live || live.stopping) return;
      live.stopping = true;
      deliver({ type: 'live', id: live.id, live: liveObj() });
      var id = live.id;
      setTimeout(function () {
        clearInterval(live.tickTimer); clearInterval(live.lineTimer); clearInterval(live.levelTimer);
        store[id].ended_at = Date.now();
        live = null;
        // With auto_summary off (the default) the page shows Generate notes instead. On, the
        // page hears "running" before the stop, as from Rust.
        var words = store[id].lines.reduce(function (n, l) { return n + l.text.split(/\s+/).length; }, 0);
        if (params.has('auto') && words >= 30) summarize(id);
        deliver({ type: 'live', id: id, live: null });
        sendList();
      }, 1200);
    }
    function summarize(id) {
      var m = store[id];
      if (!m) return;
      deliver({ type: 'summary', id: id, state: 'running' });
      setTimeout(function () {
        if (m.failOnce) {
          m.failOnce = false;
          deliver({ type: 'summary', id: id, state: 'error', error: "Claude didn't answer within 3 minutes. Check that Claude Code is signed in, then try again." });
          return;
        }
        m.summary = m.summary && m.title !== 'Vendor call' ? m.summary : SUMMARY + (m.title === 'Vendor call' ? '\n\nRaw HTML stays as text: <script>alert(1)<\/script>' : '');
        m.summary_by = 'Claude (sonnet)';
        var done = { type: 'summary', id: id, state: 'done', markdown: m.summary, by: m.summary_by };
        // An untitled meeting is named by its notes.
        if (!(m.title || '').trim()) m.title = done.title = 'Rollout plan and pilot size';
        deliver(done);
        sendList();
      }, fast ? 600 : 2600);
    }
    function resend() {
      if (S.view === 'meeting' && S.m && store[S.m.id]) deliver(meetingMsg(S.m.id));
    }
    function lateLine(atMs) {
      // A Me line released late, as the echo hold does. atMs places it anywhere; by default it
      // starts 20 s before the newest line.
      if (!live) return null;
      var lines = store[live.id].lines;
      var last = lines.reduce(function (mx, l) { return Math.max(mx, l.start_ms); }, 0);
      var n = live.next++;
      var st = typeof atMs === 'number' ? Math.max(0, atMs) : Math.max(0, last - 20000);
      var line = { id: n + 1, speaker: 'me', start_ms: st, end_ms: st + 2400, text: 'A late line (held for the echo check), placed by its start time.' };
      lines.push(line);
      deliver({ type: 'line', id: live.id, line: line });
      return line;
    }
    window.agtMock = { trayStart: start, resend: resend, lateLine: lateLine, stop: stop, notice: notice };
    if (params.has('resend')) setInterval(resend, Math.max(1, +params.get('resend') || 3) * 1000);
    return {
      handle: function (msg) {
        switch (msg && msg.type) {
          case 'ready':
            sendList();
            if (!params.has('idle')) setTimeout(start, 900);
            if (params.has('tray')) setTimeout(start, Math.max(0, +params.get('tray') || 8) * 1000);
            break;
          case 'start': start(); break;
          case 'stop': stop(); break;
          case 'pause': if (live) { live.paused = true; deliver({ type: 'live', id: live.id, live: liveObj() }); } break;
          case 'resume': if (live) { live.paused = false; live.last = Date.now(); deliver({ type: 'live', id: live.id, live: liveObj() }); } break;
          case 'notes': if (store[msg.id]) store[msg.id].notes = msg.notes; break;
          case 'title': if (store[msg.id]) { store[msg.id].title = msg.title; } break;
          case 'summarize': summarize(msg.id); break;
          case 'list': sendList(); break;
          case 'open': var mm = meetingMsg(msg.id); if (mm) setTimeout(function () { deliver(mm); }, 40); break;
          case 'open_settings':
            if (live && live.system !== 'ok') setTimeout(function () { if (live) { live.system = 'ok'; deliver({ type: 'live', id: live.id, live: liveObj() }); } }, 1000);
            break;
          case 'copy': console.log('[agt mock] copied ' + msg.text.length + ' characters'); break;
          case 'open_folder': console.log('[agt mock] would open folder for ' + msg.id); break;
        }
      }
    };
  }

  // ------------------------------------------------------------------ start
  render(false);
  var q = window.agt._queue.splice(0);
  q.forEach(function (msg) { window.agt._handle(msg); });
  send({ type: 'ready' });
})();
</script>
</body>
