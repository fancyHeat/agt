[package]
name = "agt-platform"
description = "AGT OS integration: hold-to-talk global hotkey, clipboard paste, permissions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFMachPort",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSString",
    "NSValue",
] }
