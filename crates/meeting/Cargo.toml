[package]
name = "agt-meeting"
description = "AGT meeting notes: recording and live transcription, the meeting folders, echo filtering and the AI notes through the user's Claude."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agt-audio.workspace = true
agt-stt.workspace = true
serde.workspace = true
serde_json = "1"
tracing.workspace = true

# The local time zone's offset (meeting ids, titles), and on unix killing the CLI's process group.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
