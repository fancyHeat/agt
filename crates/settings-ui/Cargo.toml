[package]
name = "agt-settings-ui"
description = "AGT settings window: native controls (AppKit, Win32) for pages of settings the app describes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agt-platform.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSDistributedNotificationCenter",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSRange",
    "NSString",
    "NSTimer",
    "NSDate",
    "NSRunLoop",
    "block2",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "NSAccessibilityProtocols",
    "NSAlert",
    "NSApplication",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSGridView",
    "NSImage",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSScroller",
    "NSSecureTextField",
    "NSStackView",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSToolbar",
    "NSToolbarItem",
    "NSUserInterfaceLayout",
    "NSView",
    "NSWindow",
] }
