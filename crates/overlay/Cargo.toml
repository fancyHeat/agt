[package]
name = "agt-overlay"
description = "AGT overlay: the small recording/transcribing pill (CPU-rendered, never takes focus)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSString",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSColor",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
png = "0.18"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(not(windows))'.dev-dependencies]
libc = "0.2"
