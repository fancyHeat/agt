[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Single source of truth for the app version. Bump this, then tag `vX.Y.Z`.
version = "0.0.10"
edition = "2024"
license = "MIT"
repository = "https://github.com/fancyHeat/agt"

[workspace.dependencies]
agt-core = { path = "crates/core" }
agt-audio = { path = "crates/audio" }
agt-platform = { path = "crates/platform" }
agt-stt = { path = "crates/stt" }
agt-polish = { path = "crates/polish" }
agt-fetch = { path = "crates/fetch" }
agt-overlay = { path = "crates/overlay" }
agt-telemetry = { path = "crates/telemetry" }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
