# STT benchmark on a GitHub-hosted Apple Silicon runner (macos-14, M1, virtualized), started
# by hand. Results are in the job summary and the `bench-macos` artifact. These runners are
# VMs without GPU/Neural Engine access: CPU numbers are indicative of an M1 at best. Core ML is
# measured on real hardware instead (Phase 4, issue #9; full run: issue #11).
name: Bench (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-macos
  cancel-in-progress: true

jobs:
  bench:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Prepare eval set
        run: uv run scripts/prepare_eval.py
      - name: Build
        run: |
          cargo build --release --locked -p agt-bench
          cargo build --release --locked -p agt-bench --features whisper-metal --target-dir target/whisper
      - name: Run
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize | tee results.txt
          run() { echo "=== $*" | tee -a results.txt; "$@" eval-data/clips 2>&1 | tee -a results.txt || true; }
          B=target/release/agt-bench
          W=target/whisper/release/agt-bench
          run $B --model parakeet-tdt-0.6b-v2 --precision int8 --device cpu --runs 3 --quiet
          run $B --model parakeet-tdt-0.6b-v2 --precision fp32 --device cpu --runs 1 --quiet
          run $W --engine whisper --model whisper-large-v3-turbo-q5_0 --device metal --runs 3 --quiet
          run $W --engine whisper --model whisper-small.en-q8_0 --device metal --runs 3 --quiet
          { echo '```'; cat results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-macos
          path: results.txt
