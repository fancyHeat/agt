name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Optional engines/backends (cargo features) that releases don't build.
      - name: Clippy with optional engines
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then F=cuda,whisper; else F=whisper-metal; fi
          cargo clippy -p agt-bench --all-targets --locked --features "$F" -- -D warnings
