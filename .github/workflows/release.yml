# Release: push a `vX.Y.Z` tag on a commit that is on `main` and whose Cargo version is X.Y.Z.
# preflight (checks + fmt/clippy/test) -> build (compiles, no secrets) -> package-windows and
# package-macos (sign, no checkout or compiling) -> publish one GitHub Release, which installed apps
# then update from.
#
# Dry run: on PRs touching this file or packaging/ the same build + package runs without signing
# and without publishing. Via workflow_dispatch from main it also signs (when configured), still
# without publishing; from other branches the package jobs fail (the `release` environment only
# admits main and v* tags).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  PACK_ID: AGT
  VPK_VERSION: 1.2.161 # keep in sync with the `velopack` crate version in Cargo.lock
  IS_RELEASE: ${{ github.event_name == 'push' }}

jobs:
  preflight:
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check version and branch
        id: version
        run: |
          VERSION="$(cargo pkgid -p agt)"; VERSION="${VERSION##*@}"
          if [ "$IS_RELEASE" = true ]; then
            # The update feed has no prerelease channel: a vX.Y.Z-beta tag would ship to everyone.
            case "$GITHUB_REF_NAME" in *-*)
              echo "::error::Prerelease tags ($GITHUB_REF_NAME) are not supported: the update feed would serve them to all users"; exit 1;;
            esac
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version $VERSION"; exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main; releases must be cut from main"; exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Compiles and stages the app. No environment, no secrets and no `id-token`: the build scripts
  # of every dependency run here, so nothing in this job can reach a signer. Packaging happens in
  # `package-windows` and `package-macos`.
  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: windows-latest
            channel: win-x64
            exe: agt.exe
          - os: macos-14
            channel: osx-arm64
            exe: agt
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo build --release --locked -p agt

      - name: Stage files
        run: |
          mkdir -p stage/publish && cp "target/release/${{ matrix.exe }}" stage/publish/
          # Windows: ONNX Runtime's DirectML build imports DirectML.dll (copied next to the exe by
          # the ort build); the copy in System32 may be older than ONNX Runtime needs.
          if [ "$RUNNER_OS" = Windows ]; then cp target/release/DirectML.dll stage/publish/; fi
          # macOS: package-macos doesn't check out the repo, so the bundle's Info.plist (version
          # stamped here) and the entitlements travel with the binary.
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir stage/macos
            sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > stage/macos/Info.plist
            cp packaging/macos/agt.entitlements stage/macos/
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ matrix.channel }}
          path: stage
          if-no-files-found: error

  # Packages and signs Windows from the files `build` staged. It never checks out or compiles
  # code, so while an Azure-trusted OIDC token can be minted only pinned actions, vpk and signtool
  # run. Tag pushes and workflow_dispatch enter the `release` environment: its variables configure
  # Azure Artifact Signing, and its OIDC subject (`…:environment:release`) is the only one Azure
  # trusts. PR dry runs get no environment and package unsigned.
  package-windows:
    needs: [preflight, build]
    runs-on: windows-latest
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # azure/login (OIDC)
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      CHANNEL: win-x64
    steps:
      - name: Check for Windows signing configuration
        id: winsign
        env:
          # Variables of the `release` environment (empty outside it, e.g. on PR dry runs).
          HAS_CONFIG: >-
            ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != ''
            && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}
        run: |
          SIGN=false
          if [ "$HAS_CONFIG" = true ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then SIGN=true; fi
          # Installed apps auto-update from releases: never ship an unsigned Windows build.
          if [ "$IS_RELEASE" = true ] && [ "$SIGN" != true ]; then
            echo "::error::Windows signing is not configured (variables of the release environment); refusing to release unsigned"
            exit 1
          fi
          echo "sign=$SIGN" >> "$GITHUB_OUTPUT"
          echo "sign=$SIGN"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-win-x64
          path: stage

      # vpk signs every unsigned binary in --packDir, so only the expected files may be there, and
      # DirectML.dll must keep its Microsoft signature (otherwise it would get signed as ours).
      - name: Check staged files
        shell: pwsh
        run: |
          $root = (Resolve-Path stage).Path
          $names = (Get-ChildItem -Recurse -Force stage |
            ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') } | Sort-Object) -join ','
          if ($names -cne 'publish,publish/agt.exe,publish/DirectML.dll') {
            Write-Output "::error::Unexpected staged files: $names"; exit 1
          }
          Move-Item stage/publish publish
          $sig = Get-AuthenticodeSignature publish/DirectML.dll
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            Write-Output "::error::DirectML.dll is not validly Microsoft-signed ($($sig.Status))"; exit 1
          }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g vpk --version "$VPK_VERSION"
      - name: Download previous release (delta)
        if: env.IS_RELEASE == 'true'
        run: |
          # The previous release lets vpk build a delta package (public repo: no token needed).
          vpk download github --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --channel "$CHANNEL" -o Releases \
            || echo "No previous release; skipping delta."

      - name: Azure login (Windows signing)
        if: steps.winsign.outputs.sign == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Package (Windows)
        env:
          SIGN: ${{ steps.winsign.outputs.sign }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          ARGS=()
          if [ "$SIGN" = true ]; then
            # vpk signs agt.exe, Update.exe, the launcher stub and Setup.exe with signtool + the
            # Artifact Signing dlib (RFC 3161 timestamp from timestamp.acs.microsoft.com),
            # authenticating through the az CLI session from the login step. No secret is involved.
            META="$RUNNER_TEMP/artifact-signing.json"
            jq -n --arg e "$AZURE_SIGNING_ENDPOINT" --arg a "$AZURE_SIGNING_ACCOUNT" --arg p "$AZURE_SIGNING_PROFILE" \
              '{Endpoint: $e, CodeSigningAccountName: $a, CertificateProfileName: $p}' > "$META"
            ARGS+=(--azureTrustedSignFile "$META")
          fi
          vpk pack --packId "$PACK_ID" --packVersion "$VERSION" --packTitle AGT --packAuthors Notics \
            --packDir publish --mainExe agt.exe --channel "$CHANNEL" --runtime "$CHANNEL" \
            --shortcuts StartMenuRoot --framework vcredist143-x64 --noPortable -o Releases "${ARGS[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: releases-win-x64
          path: Releases

  # Packages, signs and notarizes macOS from the files `build` staged, the same way: no checkout,
  # no compiling. The Apple credentials are secrets of the `release` environment, which this job
  # enters on tag pushes and workflow_dispatch (never on PRs), and only the steps that need them
  # see them. The Developer ID identity lives in a throwaway keychain that's deleted at the end.
  package-macos:
    needs: [preflight, build]
    runs-on: macos-14
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      CHANNEL: osx-arm64
    steps:
      - name: Check for macOS signing configuration
        id: macsign
        env:
          # Secrets of the `release` environment (empty outside it, e.g. on PR dry runs).
          # (APPLE_TEAM_ID is also what the verify step checks the signature against.)
          # The .pkg installer is the only download, so the "Developer ID Installer" identity is
          # part of the certificate set.
          HAS_CERT: >-
            ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != ''
            && secrets.APPLE_SIGN_IDENTITY != '' && secrets.APPLE_INSTALLER_IDENTITY != ''
            && secrets.APPLE_TEAM_ID != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          SIGN=false; NOTARIZE=false
          if [ "$HAS_CERT" = true ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            SIGN=true; NOTARIZE="$HAS_NOTARY"
          fi
          # Installed apps auto-update from releases, and Gatekeeper blocks anything not signed
          # and notarized: never ship such a macOS build.
          if [ "$IS_RELEASE" = true ] && { [ "$SIGN" != true ] || [ "$NOTARIZE" != true ]; }; then
            echo "::error::macOS signing/notarization is not configured (secrets of the release environment: sign=$SIGN notarize=$NOTARIZE); refusing to release"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$SIGN" != true ]; then
            echo "::warning::Not signing macOS: needs APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_SIGN_IDENTITY, APPLE_INSTALLER_IDENTITY and APPLE_TEAM_ID"
          elif [ "$SIGN" = true ] && [ "$NOTARIZE" != true ]; then
            echo "::warning::Not notarizing macOS: needs APPLE_ID and APPLE_APP_PASSWORD"
          fi
          echo "sign=$SIGN" >> "$GITHUB_OUTPUT"
          echo "notarize=$NOTARIZE" >> "$GITHUB_OUTPUT"
          echo "KEYCHAIN=$RUNNER_TEMP/agt-signing.keychain-db" >> "$GITHUB_ENV"
          echo "sign=$SIGN notarize=$NOTARIZE"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-osx-arm64
          path: stage

      # vpk bundles and signs everything in --packDir: only the binary may be there. The
      # entitlements come from `build` too, so allow only the ones AGT needs (see the file).
      - name: Check staged files
        run: |
          NAMES="$(cd stage && find . -mindepth 1 | LC_ALL=C sort | tr '\n' ' ')"
          EXPECTED="./macos ./macos/Info.plist ./macos/agt.entitlements ./publish ./publish/agt "
          if [ "$NAMES" != "$EXPECTED" ]; then echo "::error::Unexpected staged files: $NAMES"; exit 1; fi
          ENTITLEMENTS="$(plutil -convert json -o - stage/macos/agt.entitlements | jq -r 'keys | join(" ")')"
          if [ "$ENTITLEMENTS" != com.apple.security.device.audio-input ]; then
            echo "::error::Unexpected entitlements: $ENTITLEMENTS"; exit 1
          fi
          # The bundle id is the app's TCC identity (Microphone, Accessibility permissions).
          plutil -lint stage/macos/Info.plist
          ID="$(plutil -extract CFBundleIdentifier raw stage/macos/Info.plist)"
          EXE="$(plutil -extract CFBundleExecutable raw stage/macos/Info.plist)"
          if [ "$ID" != io.notics.agt ] || [ "$EXE" != agt ]; then
            echo "::error::Unexpected Info.plist: CFBundleIdentifier=$ID CFBundleExecutable=$EXE"; exit 1
          fi
          mv stage/publish publish
          chmod +x publish/agt # artifacts don't keep file modes

      # Before any downloaded tooling (dotnet, vpk) runs, so nothing it leaves behind can read the
      # passwords below from argv (security and notarytool take them only there) or the .p12.
      - name: Set up signing keychain
        if: steps.macsign.outputs.sign == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARIZE: ${{ steps.macsign.outputs.notarize }}
        run: |
          KEYCHAIN_PW="$(uuidgen)"
          P12="$RUNNER_TEMP/agt-signing.p12"
          trap 'rm -f "$P12"' EXIT
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # -x: the private key can't be exported again. codesign may use it without a prompt, and
          # so may Apple-signed tools (partition list), but none can extract it.
          security import "$P12" -P "$APPLE_CERT_PASSWORD" -x -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          SEARCH=("$KEYCHAIN")
          while IFS= read -r kc; do kc="${kc#*\"}"; SEARCH+=("${kc%\"*}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${SEARCH[@]}"
          if [ "$NOTARIZE" = true ]; then
            xcrun notarytool store-credentials agt-notary --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g vpk --version "$VPK_VERSION"
      - name: Download previous release (delta)
        if: env.IS_RELEASE == 'true'
        run: |
          # The previous release lets vpk build a delta package (public repo: no token needed).
          vpk download github --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --channel "$CHANNEL" -o Releases \
            || echo "No previous release; skipping delta."

      - name: Package (macOS)
        env:
          SIGN: ${{ steps.macsign.outputs.sign }}
          NOTARIZE: ${{ steps.macsign.outputs.notarize }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          # Installer only: no portable .zip.
          ARGS=(--plist stage/macos/Info.plist --signEntitlements stage/macos/agt.entitlements --noPortable)
          if [ "$SIGN" = true ]; then
            # Hardened runtime, secure timestamp; the .pkg is signed with the Developer ID
            # Installer identity. With a notary profile vpk also notarizes and staples both.
            ARGS+=(--keychain "$KEYCHAIN" --signAppIdentity "$APPLE_SIGN_IDENTITY"
              --signInstallIdentity "$APPLE_INSTALLER_IDENTITY")
            if [ "$NOTARIZE" = true ]; then ARGS+=(--notaryProfile agt-notary); fi
          fi
          vpk pack --packId "$PACK_ID" --packVersion "$VERSION" --packTitle AGT --packAuthors Notics \
            --packDir publish --mainExe agt --channel "$CHANNEL" --runtime "$CHANNEL" \
            -o Releases "${ARGS[@]}"

      # Check the app as a user's Mac would: signed by our team with the hardened runtime and,
      # when notarized, accepted by Gatekeeper with the ticket stapled. The installer .pkg itself
      # (new installs), the app inside it, and the full nupkg (what installed apps update to).
      - name: Verify signature and notarization
        if: steps.macsign.outputs.sign == 'true'
        env:
          NOTARIZE: ${{ steps.macsign.outputs.notarize }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          check_app() {
            echo "::group::$1"
            codesign --verify --deep --strict --verbose=2 "$1"
            INFO="$(codesign -dv --verbose=4 "$1" 2>&1)"; echo "$INFO"
            grep -q "^TeamIdentifier=$APPLE_TEAM_ID\$" <<<"$INFO" || { echo "::error::$1: not signed by team $APPLE_TEAM_ID"; exit 1; }
            grep -q '^CodeDirectory .*flags=.*(runtime)' <<<"$INFO" || { echo "::error::$1: hardened runtime is off"; exit 1; }
            grep -q '^Timestamp=' <<<"$INFO" || { echo "::error::$1: no secure timestamp"; exit 1; }
            if [ "$NOTARIZE" = true ]; then
              xcrun stapler validate "$1"
              # spctl accepts anything when assessments are disabled, so also require the source.
              ASSESS="$(spctl -a -vvv -t exec "$1" 2>&1)"; echo "$ASSESS"
              grep -q 'source=Notarized Developer ID' <<<"$ASSESS" \
                || { echo "::error::$1: Gatekeeper doesn't accept the app as notarized"; exit 1; }
            fi
            echo "::endgroup::"
          }
          DIR="$RUNNER_TEMP/verify"; mkdir -p "$DIR/nupkg"

          PKG="Releases/$PACK_ID-$CHANNEL-Setup.pkg"
          echo "::group::$PKG"
          SIG="$(pkgutil --check-signature "$PKG")"; echo "$SIG"
          grep -q 'Status: signed by a developer certificate issued by Apple for distribution' <<<"$SIG" \
            || { echo "::error::$PKG: not signed for distribution"; exit 1; }
          grep -q "Developer ID Installer: .*($APPLE_TEAM_ID)" <<<"$SIG" \
            || { echo "::error::$PKG: not signed by team $APPLE_TEAM_ID"; exit 1; }
          if [ "$NOTARIZE" = true ]; then
            xcrun stapler validate "$PKG"
            ASSESS="$(spctl -a -vvv -t install "$PKG" 2>&1)"; echo "$ASSESS"
            grep -q 'source=Notarized Developer ID' <<<"$ASSESS" \
              || { echo "::error::$PKG: Gatekeeper doesn't accept the installer as notarized"; exit 1; }
          fi
          echo "::endgroup::"

          # The app as the installer lays it down.
          pkgutil --expand-full "$PKG" "$DIR/pkg"
          APPS=()
          while IFS= read -r -d '' A; do APPS+=("$A"); done < <(find "$DIR/pkg" -name '*.app' -type d -prune -print0)
          if [ "${#APPS[@]}" != 1 ]; then echo "::error::Expected one .app in $PKG, found ${#APPS[@]}"; exit 1; fi
          check_app "${APPS[0]}"

          # The nupkg holds the bundle's contents under lib/app, with symlinks stored as
          # `<name>.__symlink` files containing the target; rebuild the bundle as the updater does.
          NUPKG="Releases/$PACK_ID-$VERSION-$CHANNEL-full.nupkg"
          ditto -x -k "$NUPKG" "$DIR/nupkg"
          APP="$DIR/nupkg/AGT.app"
          mv "$DIR/nupkg/lib/app" "$APP"
          while IFS= read -r -d '' LINK; do
            TARGET="$(cat "$LINK")"; rm "$LINK"; ln -s "$TARGET" "${LINK%.__symlink}"
          done < <(find "$APP" -name '*.__symlink' -print0)
          check_app "$APP"

      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/agt-signing.p12"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: releases-osx-arm64
          path: Releases

  # One job uploads both channels to a draft, then publishes it once, so the release never
  # appears half-populated and the two builds never race to create it.
  publish:
    needs: [package-windows, package-macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g vpk --version "$VPK_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: releases-*
      - name: Upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Installers only: never publish a portable build.
          PORTABLE="$(find releases-* -iname '*portable*')"
          if [ -n "$PORTABLE" ]; then echo "::error::Portable builds in the release: $PORTABLE"; exit 1; fi
          for CHANNEL in win-x64 osx-arm64; do
            vpk upload github --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
              --channel "$CHANNEL" -o "releases-$CHANNEL" --tag "$GITHUB_REF_NAME" \
              --releaseName "AGT ${GITHUB_REF_NAME#v}" --merge
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
